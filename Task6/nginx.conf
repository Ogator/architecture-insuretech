# Nginx Rate Limiting Configuration для InsureTech

# HTTP блок
http {
    # ============================================================
    # Rate Limiting Configuration
    # ============================================================

    # Создаём зону для Rate Limiting
    # - $binary_remote_addr: IP адрес клиента (в бинарном формате, экономит память)
    # - zone=partner_limit:10m: имя зоны "partner_limit", размер 10MB
    #   (10MB хватит для ~160,000 IP адресов)
    # - rate=10r/m: максимум 10 запросов в минуту (requests per minute)
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    # Дополнительная зона для burst handling (опционально)
    # Более строгий лимит для критичных эндпоинтов
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=5r/m;

    # ============================================================
    # Логирование Rate Limiting событий
    # ============================================================

    # Создаём отдельный лог для Rate Limiting событий
    log_format rate_limit_log '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'rt=$request_time limit_req_status=$limit_req_status';

    # Путь к логу Rate Limiting
    access_log /var/log/nginx/rate_limit.log rate_limit_log;

    # ============================================================
    # Upstream Configuration
    # ============================================================

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        # Алгоритм балансировки: least_conn (наименее загруженный сервер)
        least_conn;

        server backend1.example.com weight=1 max_fails=3 fail_timeout=30s;
        server backend2.example.com weight=1 max_fails=3 fail_timeout=30s;
        server backend3.example.com weight=1 max_fails=3 fail_timeout=30s;

        # Keepalive connections для снижения overhead
        keepalive 32;
    }

    # ============================================================
    # Rate Limiting Status Codes
    # ============================================================

    # Маппинг для кастомизации ответа при превышении лимита
    limit_req_status 429;  # Возвращать HTTP 429 (Too Many Requests)

    # ============================================================
    # Server Configuration
    # ============================================================

    server {
        listen 80;
        server_name api.insuretech.example.com;

        # Таймауты для защиты от медленных клиентов
        client_body_timeout 10s;
        client_header_timeout 10s;

        # ============================================================
        # Health Check Endpoint (без Rate Limiting)
        # ============================================================

        location /health {
            access_log off;  # Не логируем health check'и

            # Health check проходит без ограничений
            proxy_pass http://backend_servers/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================================
        # Metrics Endpoint (без Rate Limiting для мониторинга)
        # ============================================================

        location /metrics {
            # Доступ только с внутренних IP (Prometheus)
            allow 10.0.0.0/8;     # Внутренняя сеть
            allow 172.16.0.0/12;  # Внутренняя сеть
            deny all;

            access_log off;

            proxy_pass http://backend_servers/metrics;
            proxy_set_header Host $host;
        }

        # ============================================================
        # Main API Endpoints (с Rate Limiting)
        # ============================================================

        location / {
            # Применяем Rate Limiting
            # - zone=partner_limit: используем зону с лимитом 10r/m
            # - burst=5: разрешаем burst до 5 дополнительных запросов
            #   (они будут обработаны, но с задержкой)
            # - nodelay: не задерживаем burst запросы, сразу возвращаем 429
            limit_req zone=partner_limit burst=5 nodelay;

            # При превышении лимита Nginx вернёт HTTP 429
            # Кастомный response body можно задать через error_page

            # Proxy settings
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";  # Для keepalive

            # Таймауты
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;

            # Буферизация
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ============================================================
        # Критичные эндпоинты (более строгий Rate Limiting)
        # ============================================================

        location /api/policies {
            # Более строгий лимит: 5 запросов в минуту
            limit_req zone=strict_limit burst=2 nodelay;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/payments {
            # Более строгий лимит для платежей
            limit_req zone=strict_limit burst=2 nodelay;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================================
        # Custom Error Pages
        # ============================================================

        # Кастомная страница для HTTP 429 (Rate Limit Exceeded)
        error_page 429 /429.json;

        location = /429.json {
            internal;
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Maximum 10 requests per minute allowed.", "retry_after": 60}';
            add_header Content-Type application/json always;
            add_header Retry-After 60 always;
        }

        # Кастомная страница для других ошибок
        error_page 502 503 504 /50x.json;

        location = /50x.json {
            internal;
            default_type application/json;
            return 503 '{"error": "Service Unavailable", "message": "Backend servers are temporarily unavailable. Please try again later."}';
            add_header Content-Type application/json always;
        }
    }

    # ============================================================
    # Monitoring Server (для визуализации Rate Limiting метрик)
    # ============================================================

    server {
        listen 8080;
        server_name localhost;

        # Nginx Status Module (для мониторинга)
        location /nginx_status {
            stub_status on;
            access_log off;

            # Доступ только с localhost
            allow 127.0.0.1;
            deny all;
        }

        # Prometheus metrics exporter (требует nginx-prometheus-exporter)
        # https://github.com/nginxinc/nginx-prometheus-exporter
        location /metrics {
            access_log off;
            allow 10.0.0.0/8;
            deny all;

            # Proxy to nginx-prometheus-exporter
            proxy_pass http://127.0.0.1:9113/metrics;
        }
    }
}
