apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scaletestapp-monitor
  labels:
    app: scaletestapp
    # Метка для Prometheus Operator — находить все ServiceMonitor без фильтрации
    release: prometheus
spec:
  selector:
    matchLabels:
      app: scaletestapp
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
